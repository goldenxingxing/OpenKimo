name: Release

# Releases are built by goldenxingxing/OpenKimo-releases/.github/workflows/
# release.yml, where standard runners cost no Actions minutes (this private
# repo bills macOS at 10x and ran out of quota). Kept as a manual fallback
# only — a tag push would otherwise build and push every image twice:
#   gh workflow run release.yml -R goldenxingxing/OpenKimo --ref v0.2.2
on:
  workflow_dispatch:

env:
  GATEWAY_IMAGE: ghcr.io/goldenxingxing/kimo-agent-gateway
  SANDBOX_IMAGE: ghcr.io/goldenxingxing/kimo-agent-sandbox

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The single creator of the release. The image job and the three
      # installer jobs all upload into it, so none of them races to create it:
      # concurrent creates meant one job could fail with HTTP 422
      # already_exists, or a body-less create from a build job could win and
      # leave the release with no notes.
      #
      # Published to the public downloads repo; this code repo is private, so
      # its own releases would not be downloadable.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          repository: goldenxingxing/OpenKimo-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Docker Images

            Pull pre-built images (no local build required):

            ```bash
            docker pull ${{ env.GATEWAY_IMAGE }}:${{ github.ref_name }}
            docker pull ${{ env.SANDBOX_IMAGE }}:${{ github.ref_name }}
            ```

            ## Quick Start

            ```bash
            # 1. Download config files
            curl -O https://raw.githubusercontent.com/goldenxingxing/OpenKimo-releases/main/docker-compose.yml
            curl -O https://raw.githubusercontent.com/goldenxingxing/OpenKimo-releases/main/.env.example
            cp .env.example .env

            # 2. Set your API key in .env
            # 3. Start (pulls images automatically)
            docker compose up -d
            ```

  release:
    timeout-minutes: 90
    name: Build & Push Images
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release
      packages: write   # push to ghcr.io

    steps:
      # ubuntu-latest runners ship with ~14GB free; two image builds plus
      # buildx cache (mode=max) exhaust it (seen as "no space left on
      # device" during the sandbox build). Reclaim toolchains we never use
      # (~30GB); keeps Docker itself intact.
      - name: Free disk space
        # Pinned to a commit, not @main: this is the first step of the one job
        # holding packages: write and RELEASES_TOKEN, so a force-push or an
        # account compromise upstream would run attacker code with both. The
        # SHA below is tag v1.3.1.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Gateway ----
      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:latest
            ${{ env.GATEWAY_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      # Drop the gateway build cache before the sandbox build; the sandbox
      # build uses its own cache scope, so nothing needed later is lost.
      - name: Prune gateway build cache
        run: |
          docker system prune -af
          docker builder prune -af

      # ---- Sandbox ----
      - name: Build and push sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          push: true
          tags: |
            ${{ env.SANDBOX_IMAGE }}:latest
            ${{ env.SANDBOX_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

  build-macos:
    timeout-minutes: 60
    name: Build macOS .app DMG
    needs: create-release
    runs-on: macos-latest   # ARM64 (M-series) runner
    permissions:
      contents: write       # upload release assets

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install venvstacks uv

      - name: Cache venvstacks layers
        uses: actions/cache@v5
        with:
          path: |
            packaging/.build
            packaging/wheels
          key: ${{ runner.os }}-${{ runner.arch }}-venvstacks-${{ hashFiles('packaging/venvstacks.toml', 'kimo-cli/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-venvstacks-

      - name: Build .app + DMG
        run: |
          cd packaging
          python build.py --version "${GITHUB_REF_NAME#v}"

      - name: Verify DMG was produced
        run: |
          ls -lh dist/*.dmg
          test -n "$(ls dist/*.dmg 2>/dev/null)" || { echo '::error::No DMG found under dist/'; exit 1; }


      # The exact dependency set this release resolved, with hashes. It is not
      # committed (packaging/.gitignore ignores requirements/), and
      # `venvstacks lock` re-resolves on every build, so what ships is whatever
      # PyPI had at build time — kimo-cli's own uv.lock pins anthropic 0.78.0
      # while v0.1.41 shipped 1.3.0, a major bump that also swapped httpx for
      # httpx2, and nothing tested that combination. Publishing the lock makes
      # each release's set recoverable and diffable, and is the input needed to
      # commit both platforms' locks and switch `venvstacks lock` to
      # --if-needed, which is what would make a rebuild of a tag reproducible.
      - name: Upload resolved dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venvstacks-locks-${{ runner.arch }}
          path: packaging/requirements/
          if-no-files-found: warn

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v3
        with:
          repository: goldenxingxing/OpenKimo-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: dist/*.dmg
          fail_on_unmatched_files: true

  build-macos-intel:
    timeout-minutes: 60
    name: Build macOS .app DMG (Intel x86_64)
    needs: create-release
    runs-on: macos-15-intel   # current Intel runner from GitHub Actions (macos-13 retired)
    permissions:
      contents: write       # upload release assets

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install venvstacks uv

      - name: Cache venvstacks layers
        uses: actions/cache@v5
        with:
          path: |
            packaging/.build
            packaging/wheels
          key: ${{ runner.os }}-${{ runner.arch }}-venvstacks-${{ hashFiles('packaging/venvstacks.toml', 'kimo-cli/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-venvstacks-

      - name: Build .app + DMG
        run: |
          cd packaging
          python build.py --arch x86_64 --version "${GITHUB_REF_NAME#v}"

      - name: Verify DMG was produced
        run: |
          ls -lh dist/*.dmg
          test -n "$(ls dist/*.dmg 2>/dev/null)" || { echo '::error::No DMG found under dist/'; exit 1; }


      # The exact dependency set this release resolved, with hashes. It is not
      # committed (packaging/.gitignore ignores requirements/), and
      # `venvstacks lock` re-resolves on every build, so what ships is whatever
      # PyPI had at build time — kimo-cli's own uv.lock pins anthropic 0.78.0
      # while v0.1.41 shipped 1.3.0, a major bump that also swapped httpx for
      # httpx2, and nothing tested that combination. Publishing the lock makes
      # each release's set recoverable and diffable, and is the input needed to
      # commit both platforms' locks and switch `venvstacks lock` to
      # --if-needed, which is what would make a rebuild of a tag reproducible.
      - name: Upload resolved dependency locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venvstacks-locks-${{ runner.arch }}
          path: packaging/requirements/
          if-no-files-found: warn

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v3
        with:
          repository: goldenxingxing/OpenKimo-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: dist/*.dmg
          fail_on_unmatched_files: true

  build-windows:
    timeout-minutes: 60
    name: Build Windows x64 installer
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # build_windows.py prints box-drawing chars and © via Python's default
      # stdout encoding, which is cp1252 on Windows and rejects non-ASCII.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js LTS
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # uv: build kimo-cli wheel
          # pillow: generate_ico converts packaging/icon.png -> .ico (host-side)
          # (the launcher is now a native C exe built with MinGW gcc, not PyInstaller)
          python -m pip install uv pillow

      - name: Set up MSYS2 (MinGW gcc for the native launcher)
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW gcc/windres to PATH
        shell: bash
        run: echo "${{ steps.msys.outputs.msys-path }}/mingw64/bin" >> "$GITHUB_PATH"

      - name: Install Inno Setup
        shell: pwsh
        # The build script's find_iscc() searches PATH then falls back to
        # "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" — exactly where the
        # chocolatey package lands. windows-latest ships choco preinstalled.
        run: choco install innosetup --no-progress -y

      - name: Cache packaging artifacts
        uses: actions/cache@v5
        with:
          path: |
            packaging/.cache
            build/runtime-staging
          key: ${{ runner.os }}-${{ runner.arch }}-winpkg-${{ hashFiles('packaging/requirements-windows.txt', 'packaging/build_windows.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-winpkg-

      - name: Build installer .exe
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          cd packaging
          python build_windows.py --version $version

      - name: Verify installer was produced
        shell: pwsh
        run: |
          Get-ChildItem dist-win/*.exe
          if (-not (Get-ChildItem dist-win/*.exe -ErrorAction SilentlyContinue)) {
            Write-Error "No .exe found under dist-win/"
            exit 1
          }

      - name: Upload installer to Release
        uses: softprops/action-gh-release@v3
        with:
          repository: goldenxingxing/OpenKimo-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: dist-win/*.exe
          fail_on_unmatched_files: true
