name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# None of these jobs writes anything; the default token scope is wider than
# they need.
permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------
  # Frontend: lint + typecheck + build
  # -----------------------------------------------------------------
  frontend:
    timeout-minutes: 20
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # -----------------------------------------------------------------
  # Backend: lint + typecheck + test
  # -----------------------------------------------------------------
  backend:
    timeout-minutes: 30
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      # This job declared 3.12 through actions/setup-python and ran 3.14:
      # `uv sync` picks the interpreter from .python-version and ignores what
      # setup-python put on PATH. Setting it here is what actually decides,
      # and 3.12 is what release.yml ships. Every step below was checked on it.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install dependencies
        run: uv sync --frozen

      # Whole repository, not just wiki/. The narrow scope let six lint errors
      # and thirteen unformatted files accumulate outside it, and a check that
      # only looks at one directory reports nothing about the rest.
      - name: Ruff lint
        run: uv run ruff check src tests benchmarks

      - name: Ruff format check
        run: uv run ruff format --check src tests benchmarks

      - name: Pyright typecheck
        run: uv run pyright src/kimo_cli/web/

      # This repository's own Python, which nothing linted. The ruff steps
      # above run with working-directory: kimo-cli over `src tests benchmarks`,
      # i.e. the submodule's tree — so app/, packaging/ and this repo's tests/
      # were never checked at all. packaging/app_main/settings_window.py is
      # 1500 lines that no test imports (every reference reads it as text), so
      # an undefined name or a NameError on the save path left the whole suite
      # green.
      #
      # Deliberately the error-only subset (E9 syntax, F63/F7 broken
      # constructs, F82 undefined names) rather than ruff's defaults: the
      # defaults report 127 findings here, almost all style, and gating CI on
      # a cleanup nobody has done yet would just get the step disabled. This
      # catches the class of defect that actually ships.
      - name: Ruff error check (OpenKimo sources)
        working-directory: .
        run: >-
          .venv/bin/python -m ruff check
          --select E9,F63,F7,F82
          app packaging tests scripts .github/scripts

      - name: Tests
        working-directory: .
        run: .venv/bin/python -m pytest tests -v --tb=short --inline-snapshot=disable

  # -----------------------------------------------------------------
  # kimo-cli's own suite, which nothing used to run
  # -----------------------------------------------------------------
  # The backend job above runs this repository's tests, and kimo-cli's own
  # workflows are not what gates work here. Its suite went unrun long enough to
  # reach forty-four failures, two of them real: a session listing that could
  # not see any session written since sessions moved into the work directory,
  # and a benchmark pinned to one machine's absolute path.
  #
  # Separate from `backend` so a five-minute run does not delay the lint and
  # typecheck feedback, and so a failure says which suite broke.
  kimo-cli-tests:
    name: kimo-cli tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    env:
      # 3.12 is what release.yml builds the shipped artifact on, and a suite
      # green on the 3.14 in .python-version says nothing about the binary
      # users get. Set here rather than through actions/setup-python, which
      # `uv sync` ignores in favour of .python-version — verified, and the
      # reason the job above reports 3.12 while running 3.14. The suite was
      # checked on both before this was wired up.
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Confirm the interpreter under test
        run: uv run python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"

      - name: Tests
        run: uv run pytest tests -q --inline-snapshot=disable

  # -----------------------------------------------------------------
  # Docker: verify images build successfully
  # -----------------------------------------------------------------
  docker-build:
    timeout-minutes: 45
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build gateway image
        run: docker build -f Dockerfile.gateway -t kimo-agent-gateway:ci .
