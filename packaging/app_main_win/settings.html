<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OpenKimo Settings</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --fg: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --accent: #0a84ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 28px 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .sub {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .panel h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 12px;
    }
    .row {
      display: flex;
      align-items: center;
      margin: 10px 0;
      gap: 12px;
    }
    .row > label {
      flex: 0 0 130px;
      color: var(--fg);
    }
    .row > .control {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input[type="text"],
    input[type="password"],
    input[type="number"],
    select {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      font-size: 13px;
      color: var(--fg);
      font-family: inherit;
    }
    input[type="number"] { max-width: 140px; }
    select { flex: 0 1 200px; }
    input[type="range"] { flex: 1; max-width: 260px; }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .slider-value {
      color: var(--muted);
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .checkbox-row > label { flex: 0 0 130px; }
    button {
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      color: var(--fg);
    }
    button:hover { background: #f0f0f0; }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.primary:hover { background: var(--accent); filter: brightness(1.08); }
    button.flat {
      border: none;
      background: transparent;
      color: var(--accent);
      padding-left: 0;
    }
    button.flat:hover { background: transparent; text-decoration: underline; }
    /* Provider card — mirrors the macOS accent-bar row */
    .provider {
      border-left: 3px solid var(--accent);
      padding: 8px 12px 12px 9px;
      margin: 12px 0;
      background: #fafafa;
      border-radius: 0 6px 6px 0;
    }
    .provider .ptitle {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .provider .row > label { flex: 0 0 118px; }
    .provider .pfooter {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-top: 10px;
    }
    .provider .pfooter .left { display: flex; flex-direction: column; gap: 6px; }
    .provider .default-label { color: var(--fg); }
    .provider .default-label input { margin-right: 6px; }
    .advanced-toggle {
      border: none;
      background: transparent;
      color: var(--fg);
      padding: 0;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
    }
    .advanced-toggle:hover { background: transparent; text-decoration: underline; }
    .caps { display: none; flex-direction: column; gap: 4px; margin-top: 4px; }
    .caps.open { display: flex; }
    .caps label { color: var(--fg); font-size: 12px; }
    .caps input { margin-right: 6px; }
    .actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 28px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .actions .right { display: flex; gap: 8px; }
    .footer-wrap {
      position: sticky;
      bottom: 0;
      background: var(--bg);
    }
    .error {
      color: #d70015;
      margin: 0 28px 8px;
      font-size: 12px;
      min-height: 1em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>OpenKimo Settings</h1>
    <p class="sub">Edits to your local <code>.env</code>. Saving applies changes to idle sessions at once; a session that is working picks them up when it finishes.</p>

    <div class="panel">
      <h2>LLM</h2>
      <div class="row checkbox-row">
        <label for="thinking">Thinking</label>
        <div class="control">
          <input type="checkbox" id="thinking" />
        </div>
      </div>
      <div class="row">
        <label for="temperature">Temperature</label>
        <div class="control">
          <input type="range" id="temperature" min="0" max="2" step="0.05" value="0" />
          <span class="slider-value" id="temperature_value">0.00</span>
        </div>
      </div>

      <div id="providers"></div>
      <button class="flat" id="add_provider">+ Add Provider</button>
    </div>

    <div class="panel">
      <h2>Web Server</h2>
      <div class="row">
        <label>Port</label>
        <div class="control">
          <input type="number" id="web_port" min="1024" max="65535" placeholder="5494" />
        </div>
      </div>
      <div class="row">
        <label>Session Token</label>
        <div class="control">
          <input type="password" id="session_token" placeholder="leave empty to disable auth" autocomplete="off" />
          <button id="generate_token">Generate</button>
        </div>
      </div>
      <div class="row checkbox-row">
        <label for="lan_only">LAN Only</label>
        <div class="control">
          <input type="checkbox" id="lan_only" />
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Branding</h2>
      <button id="reset_branding">Reset Branding to Packaged Defaults</button>
    </div>

  </div>

  <div class="footer-wrap">
    <p id="error" class="error"></p>
    <div class="actions">
      <button id="cancel">Cancel</button>
      <div class="right">
        <button id="save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    // Mirrors packaging/app_main/settings_window.py constants.
    const PROVIDER_TYPES = ["kimi", "openai_legacy", "anthropic"];
    const CAPABILITIES = ["image_in", "video_in", "thinking", "always_thinking"];
    const DEFAULT_MAX_CONTEXT = 1000000;
    const LEGACY_LLM_KEYS = [
      "LLM_PROVIDER",
      "KIMI_API_KEY", "KIMI_BASE_URL", "KIMI_MODEL_NAME", "KIMI_MODEL_MAX_CONTEXT_SIZE",
      "OPENAI_API_KEY", "OPENAI_BASE_URL",
      "ANTHROPIC_API_KEY", "ANTHROPIC_BASE_URL",
    ];

    function setError(msg) {
      $("error").textContent = msg || "";
    }

    // ---- provider cards -------------------------------------------------

    let providerSeq = 0;
    // Default model state resolved at window open. initialDefault preserves
    // the default that was in effect (e.g. chosen via the web model selector
    // and stored in config.toml) so a save can never silently swap it for
    // the first provider. hasExplicitDefault gates the first-item fallback:
    // it is only allowed when neither config.toml nor .env names a default.
    let initialDefault = "";
    let initialPort = "";
    let hasExplicitDefault = false;

    function providerCard(entry) {
      entry = entry || {};
      const card = document.createElement("div");
      card.className = "provider";
      card.dataset.pid = String(++providerSeq);

      const caps = Array.isArray(entry.capabilities) && entry.capabilities.length
        ? new Set(entry.capabilities.map(String))
        : new Set(CAPABILITIES);

      const typeOptions = PROVIDER_TYPES.map((t) => {
        const sel = (entry.type || PROVIDER_TYPES[0]) === t ? " selected" : "";
        return `<option value="${t}"${sel}>${t}</option>`;
      }).join("");

      const capBoxes = CAPABILITIES.map((c) => {
        const checked = caps.has(c) ? " checked" : "";
        return `<label><input type="checkbox" class="cap" value="${c}"${checked} />${c}</label>`;
      }).join("");

      card.innerHTML = `
        <div class="ptitle">Provider</div>
        <div class="row"><label>Name</label><div class="control">
          <input type="text" class="p-name" placeholder="provider name" /></div></div>
        <div class="row"><label>Type</label><div class="control">
          <select class="p-type">${typeOptions}</select></div></div>
        <div class="row"><label>API Key</label><div class="control">
          <input type="password" class="p-apikey" placeholder="API key" autocomplete="off" /></div></div>
        <div class="row"><label>Base URL</label><div class="control">
          <input type="text" class="p-baseurl" placeholder="https://..." /></div></div>
        <div class="row"><label>Model</label><div class="control">
          <input type="text" class="p-model" placeholder="model id" /></div></div>
        <div class="row"><label>Max Context</label><div class="control">
          <input type="number" class="p-maxctx" placeholder="1000000" /></div></div>
        <div class="pfooter">
          <div class="left">
            <label class="default-label"><input type="radio" name="default_provider" class="p-default" />Set as default</label>
            <button type="button" class="advanced-toggle">&#9654; Advanced (capabilities)</button>
            <div class="caps">${capBoxes}</div>
          </div>
          <button type="button" class="p-remove">Remove</button>
        </div>`;

      card.querySelector(".p-name").value = entry.name || "";
      card.querySelector(".p-apikey").value = entry.api_key || "";
      card.querySelector(".p-baseurl").value = entry.base_url || "";
      card.querySelector(".p-model").value = entry.model || "";
      card.querySelector(".p-maxctx").value = entry.max_context_size || "";

      card.querySelector(".advanced-toggle").addEventListener("click", (ev) => {
        const capsEl = card.querySelector(".caps");
        const open = capsEl.classList.toggle("open");
        ev.target.innerHTML = (open ? "&#9660;" : "&#9654;") + " Advanced (capabilities)";
      });
      card.querySelector(".p-remove").addEventListener("click", () => {
        const name = card.querySelector(".p-name").value.trim() || "this provider";
        if (!window.confirm(`Remove “${name}” from the list?`)) return;
        const wasDefault = card.querySelector(".p-default").checked;
        card.remove();
        const first = document.querySelector("#providers .provider .p-default");
        if (wasDefault && first) first.checked = true;
        renumber();
      });
      return card;
    }

    function renumber() {
      document.querySelectorAll("#providers .provider").forEach((card, i) => {
        card.querySelector(".ptitle").textContent = `Provider ${i + 1}`;
      });
    }

    function addProvider(entry, makeDefault) {
      const card = providerCard(entry);
      $("providers").appendChild(card);
      // Only auto-check the first provider when no default was in effect at
      // load; never override a default the user already picked elsewhere.
      if (makeDefault ||
          (!hasExplicitDefault && !document.querySelector("#providers .p-default:checked"))) {
        card.querySelector(".p-default").checked = true;
      }
      renumber();
      return card;
    }

    // ---- load -----------------------------------------------------------

    function legacyEntries(data) {
      // Mirrors _legacy_entries in the macOS settings window.
      const out = [];
      if (data.KIMI_API_KEY) {
        out.push({
          name: "kimi", type: "kimi",
          api_key: data.KIMI_API_KEY,
          base_url: data.KIMI_BASE_URL || "https://api.moonshot.cn/v1",
          model: data.KIMI_MODEL_NAME || "kimi-k2",
          max_context_size: parseInt(data.KIMI_MODEL_MAX_CONTEXT_SIZE, 10) || DEFAULT_MAX_CONTEXT,
        });
      }
      if (data.OPENAI_API_KEY) {
        out.push({
          name: "openai", type: "openai_legacy",
          api_key: data.OPENAI_API_KEY,
          base_url: data.OPENAI_BASE_URL || "https://api.openai.com/v1",
          model: "gpt-4o", max_context_size: 128000,
        });
      }
      if (data.ANTHROPIC_API_KEY) {
        out.push({
          name: "anthropic", type: "anthropic",
          api_key: data.ANTHROPIC_API_KEY,
          base_url: data.ANTHROPIC_BASE_URL || "https://api.anthropic.com",
          model: "claude-3-5-sonnet-20241022", max_context_size: 200000,
        });
      }
      return out;
    }

    async function load() {
      try {
        const data = await window.pywebview.api.load_env();

        let entries = [];
        try {
          const parsed = JSON.parse(data.LLM_PROVIDERS || "[]");
          if (Array.isArray(parsed)) {
            entries = parsed.filter((p) => p && typeof p === "object" && p.name);
          }
        } catch (e) { /* fall through to legacy */ }
        if (!entries.length) entries = legacyEntries(data);

        // The web UI's model selector writes default_model to config.toml
        // without touching .env (injected by load_env as
        // CONFIG_TOML_DEFAULT_MODEL), so prefer it; fall back to .env only
        // when the toml has no default, and to the first entry only when
        // neither names one.
        const explicitDefault = (data.CONFIG_TOML_DEFAULT_MODEL ||
          data.LLM_DEFAULT_PROVIDER || data.LLM_PROVIDER || "").trim().toLowerCase();
        hasExplicitDefault = explicitDefault !== "";
        const defaultName = explicitDefault ||
          ((entries[0] && entries[0].name) || "").trim().toLowerCase();
        initialDefault = defaultName;

        $("providers").innerHTML = "";
        entries.forEach((entry) => {
          addProvider(entry,
            String(entry.name || "").trim().toLowerCase() === defaultName);
        });

        $("thinking").checked = (data.LLM_THINKING || "").toLowerCase() === "true";
        const temp = parseFloat(data.LLM_TEMPERATURE || "0");
        $("temperature").value = isNaN(temp) ? 0 : temp;
        syncTemperatureLabel();
        $("web_port").value = data.KIMI_WEB_PORT || "5494";
        initialPort = $("web_port").value;
        $("session_token").value = data.KIMI_WEB_SESSION_TOKEN || "";
        $("lan_only").checked = (data.KIMI_WEB_LAN_ONLY || "").toLowerCase() === "true";
      } catch (e) {
        setError("Failed to load settings: " + e);
      }
    }

    // ---- save -----------------------------------------------------------

    function collectProviders() {
      const list = [];
      const seen = new Set();
      let defaultName = "";
      document.querySelectorAll("#providers .provider").forEach((card) => {
        const name = card.querySelector(".p-name").value.trim();
        const apiKey = card.querySelector(".p-apikey").value.trim();
        if (!name || !apiKey) return;  // mirrors macOS: skip incomplete rows
        if (seen.has(name.toLowerCase())) {
          throw new Error(`Duplicate provider name: "${name}". Names must be unique.`);
        }
        seen.add(name.toLowerCase());
        let ctx = parseInt(card.querySelector(".p-maxctx").value.trim(), 10);
        if (!ctx || ctx <= 0) ctx = DEFAULT_MAX_CONTEXT;
        const entry = {
          name,
          type: card.querySelector(".p-type").value,
          api_key: apiKey,
          base_url: card.querySelector(".p-baseurl").value.trim(),
          model: card.querySelector(".p-model").value.trim(),
          max_context_size: ctx,
        };
        const caps = Array.from(card.querySelectorAll(".cap:checked")).map((c) => c.value);
        if (caps.length) entry.capabilities = caps;
        list.push(entry);
        if (card.querySelector(".p-default").checked) defaultName = name;
      });
      return { list, defaultName };
    }

    function gather() {
      const { list, defaultName } = collectProviders();
      const updates = {
        LLM_THINKING: $("thinking").checked ? "true" : "false",
        LLM_TEMPERATURE: parseFloat($("temperature").value || "0").toFixed(2),
        KIMI_WEB_PORT: $("web_port").value.trim(),
        KIMI_WEB_SESSION_TOKEN: $("session_token").value,
        KIMI_WEB_LAN_ONLY: $("lan_only").checked ? "true" : "false",
      };
      if (list.length) {
        updates.LLM_PROVIDERS = JSON.stringify(list);
        // Never silently swap the user's default: when no radio is checked,
        // keep the default that was in effect at window open instead of
        // clobbering it with the first provider.
        updates.LLM_DEFAULT_PROVIDER = defaultName || initialDefault || list[0].name;
        LEGACY_LLM_KEYS.forEach((k) => { updates[k] = ""; });
      } else {
        updates.LLM_PROVIDERS = "";
        updates.LLM_DEFAULT_PROVIDER = "";
      }
      return updates;
    }

    async function save() {
      setError("");
      let updates;
      try {
        updates = gather();
      } catch (e) {
        setError(e.message || String(e));
        return;
      }
      // Everything else is applied to the running server without restarting
      // it. The port cannot be: the socket is already bound. Restarting ends
      // any session that is currently working, so it is offered, never taken.
      let restart = false;
      if ((updates.KIMI_WEB_PORT || "") !== (initialPort || "")) {
        restart = window.confirm(
          "Restart the server to use the new port?\n\n" +
          "Everything else you changed is already in effect. The port (" +
          (initialPort || "default") + " \u2192 " + updates.KIMI_WEB_PORT +
          ") only changes when the server restarts, which ends any session " +
          "that is currently working."
        );
      }
      try {
        await window.pywebview.api.save_env(updates, restart);
      } catch (e) {
        setError("Failed to save: " + e);
      }
    }

    // ---- misc actions ---------------------------------------------------

    function syncTemperatureLabel() {
      $("temperature_value").textContent =
        parseFloat($("temperature").value || "0").toFixed(2);
    }

    $("temperature").addEventListener("input", syncTemperatureLabel);
    $("add_provider").addEventListener("click", () => addProvider(null, false));
    $("generate_token").addEventListener("click", () => {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      $("session_token").value =
        Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
    });
    $("reset_branding").addEventListener("click", async () => {
      setError("");
      try {
        await window.pywebview.api.reset_branding();
        window.alert("Branding reset. Refresh your browser to see the packaged defaults.");
      } catch (e) {
        setError("Reset failed: " + e);
      }
    });

    $("save").addEventListener("click", () => save());
    $("cancel").addEventListener("click", () => window.pywebview.api.cancel());
    window.addEventListener("pywebviewready", load);
  </script>
</body>
</html>
